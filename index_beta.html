<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SplitBill</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #000000;
  --surface: #0a0a0a;
  --surface-raised: #121212;
  --surface-input: #161616;
  --border: #222222;
  --border-subtle: #181818;
  --border-hover: #383838;
  --text: #ffffff;
  --text-muted: #a1a1aa;
  --text-dim: #71717a;

  /* Accent: Refined Crimson — reserved for titles dot, grand total, delete hovers */
  --accent: #e11d48;
  --accent-soft: rgba(225, 29, 72, 0.08);
  --accent-border: rgba(225, 29, 72, 0.5);

  /* Secondary Accent: Slate Periwinkle */
  --accent2: #a5b4fc;
  --accent2-border: rgba(165, 180, 252, 0.45);
  --accent2-border-bright: #a5b4fc;
  --accent2-soft: rgba(165, 180, 252, 0.12);

  --font-serif: 'Instrument Serif', Georgia, serif;
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14.5px;
  line-height: 1.5;
  padding: 2.5rem 1.25rem 5rem;
  min-height: 100vh;
}

.container {
  max-width: 720px;
  margin: 0 auto;
}

/* ── App Header ── */
.app-header {
  margin-bottom: 2.25rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand-title {
  font-family: var(--font-serif);
  font-size: 2.4rem;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: #ffffff;
  display: inline-flex;
  align-items: baseline;
}
.brand-i {
  position: relative;
  display: inline-block;
}
.brand-dot {
  position: absolute;
  top: 0.22em;
  left: 50%;
  transform: translateX(-50%);
  width: 0.13em;
  height: 0.13em;
  background: var(--accent);
  border-radius: 50%;
}
.btn-reset {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 6px;
  padding: 0.38rem 0.75rem;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 0.8rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  transition: all 0.2s;
}
.btn-reset:hover {
  color: #ffffff;
  border-color: var(--border-hover);
  background: var(--surface-raised);
}

/* ── Unassigned Item Warnings ── */
.item-row.unassigned {
  border-color: rgba(245, 158, 11, 0.45);
}
.unassigned-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.74rem;
  color: #fbbf24;
  font-weight: 500;
  margin-left: auto;
}
.summary-warning-bar {
  background: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.25);
  border-radius: 6px;
  padding: 0.65rem 0.95rem;
  margin-bottom: 1.15rem;
  font-size: 0.82rem;
  color: #fcd34d;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* ── Sections ── */
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  margin-bottom: 1.35rem;
  transition: border-color 0.2s;
}
.section:hover {
  border-color: var(--border-hover);
}
.section-header {
  margin-bottom: 1.2rem;
}
.section-title {
  font-family: var(--font-serif);
  font-size: 1.55rem;
  color: #ffffff;
  font-weight: 400;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
/* Crimson dot — user explicitly likes this, keep it */
.section-title::before {
  content: '';
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

/* ── Step 1: People ── */
.people-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.55rem;
  align-items: center;
}
.person-tag {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.4rem 0.7rem;
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  transition: border-color 0.2s;
}
/* Accent 2 focus */
.person-tag:focus-within {
  border-color: var(--accent2-border-bright);
}
.person-name-input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.88rem;
  font-weight: 600;
  width: 95px;
}
.btn-del-person {
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  padding: 2px;
  transition: color 0.15s;
}
/* Delete stays crimson — destructive action */
.btn-del-person:hover:not(:disabled) {
  color: var(--accent);
}
.btn-del-person:disabled {
  opacity: 0.2;
  cursor: not-allowed;
}
.btn-add-person {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-muted);
  border-radius: 6px;
  padding: 0.4rem 0.85rem;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  transition: all 0.2s;
}
/* Accent 2 hover */
.btn-add-person:hover {
  color: var(--accent2);
  border-color: var(--accent2-border-bright);
}

/* ── Step 2: Items ── */
.items-table {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.item-row {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.9rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  transition: border-color 0.2s;
}
.item-row:hover {
  border-color: var(--border-hover);
}
.item-inputs {
  display: grid;
  grid-template-columns: 1fr 135px 36px;
  gap: 0.6rem;
  align-items: center;
}
.input-field {
  background: var(--surface-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  padding: 0.52rem 0.8rem;
  outline: none;
  width: 100%;
  transition: border-color 0.2s;
}
/* Accent 2 focus */
.input-field:focus {
  border-color: var(--accent2-border-bright);
}
.price-box {
  position: relative;
  display: flex;
  align-items: center;
}
.currency-symbol {
  position: absolute;
  left: 0.75rem;
  color: var(--text-dim);
  font-size: 0.9rem;
  font-weight: 500;
  pointer-events: none;
}
.price-box .input-field {
  padding-left: 1.8rem;
}
.btn-del-item {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 6px;
  height: 38px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
/* Delete stays crimson — destructive action */
.btn-del-item:hover {
  color: var(--accent);
  border-color: var(--accent-border);
  background: var(--accent-soft);
}

/* Split Pills — switchable secondary accent active states */
.item-sharing {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.4rem;
  padding-top: 0.35rem;
  border-top: 1px solid var(--border-subtle);
}
.btn-pill {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-size: 0.8rem;
  font-weight: 500;
  padding: 0.28rem 0.65rem;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.btn-pill:hover {
  color: #fff;
  border-color: var(--border-hover);
}
/* Clean outline style: transparent background, only border & text highlight */
.btn-pill.active {
  background: transparent;
  color: var(--accent2);
  border-color: var(--accent2-border-bright);
  font-weight: 600;
}
.btn-pill.pill-all {
  border-style: dashed;
}
/* Clean outline style for "All" pill */
.btn-pill.pill-all.active {
  background: transparent;
  color: var(--accent2);
  border-style: solid;
  border-color: var(--accent2-border-bright);
}

.btn-add-item {
  width: 100%;
  margin-top: 0.9rem;
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-muted);
  border-radius: 6px;
  padding: 0.75rem;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 0.88rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  transition: all 0.2s;
}
/* Accent 2 hover */
.btn-add-item:hover {
  color: var(--accent2);
  border-color: var(--accent2-border-bright);
}

/* ── Step 3: VAT & SD ── */
.taxes-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
.tax-item {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.95rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}
.tax-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tax-name {
  font-size: 0.82rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}
.btn-toggle-group {
  display: inline-flex;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 5px;
  overflow: hidden;
}
.btn-toggle {
  background: transparent;
  border: none;
  font-family: var(--font-sans);
  font-size: 0.72rem;
  font-weight: 500;
  padding: 0.22rem 0.55rem;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
}
/* Secondary Accent active toggle */
.btn-toggle.active {
  background: var(--accent2-soft);
  color: var(--accent2);
  font-weight: 600;
}
.tax-preview {
  font-size: 0.76rem;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
}
.tax-preview strong {
  color: var(--text);
}

/* ── Step 4: Summary ── */
.summary-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.5rem;
}
.summary-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.25rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.summary-title {
  font-family: var(--font-serif);
  font-size: 1.6rem;
  color: #ffffff;
  font-weight: 400;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
/* Crimson dot — keep it */
.summary-title::before {
  content: '';
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

/* Overview Bar */
.totals-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.75rem;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.9rem 1.1rem;
  margin-bottom: 1.35rem;
}
.tot-box {
  display: flex;
  flex-direction: column;
}
.tot-label {
  font-size: 0.72rem;
  color: var(--text-dim);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.tot-val {
  font-family: var(--font-sans);
  font-size: 1.25rem;
  font-weight: 700;
  color: #ffffff;
}
/* Crimson for grand total — intentional, keep it */
.tot-val.accent-val {
  color: var(--accent);
}

/* Cards View */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 0.85rem;
}
.res-card {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1.1rem;
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  transition: border-color 0.2s;
}
/* Card hover */
.res-card:hover {
  border-color: var(--accent2-border);
}
.res-card-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.res-card-name {
  font-family: var(--font-sans);
  font-size: 0.95rem;
  font-weight: 600;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 120px;
}
/* Individual share in secondary accent — grand total stays crimson */
.res-card-total {
  font-family: var(--font-sans);
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--accent2);
}
.res-card-breakdown {
  border-top: 1px solid var(--border-subtle);
  padding-top: 0.6rem;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  font-family: var(--font-sans);
  font-size: 0.8rem;
  color: var(--text-muted);
}
.breakdown-row {
  display: flex;
  justify-content: space-between;
}

/* ── Card Paid & Net Balance ── */
.res-card-paid-row {
  margin-top: 0.75rem;
  padding-top: 0.65rem;
  border-top: 1px dashed var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
}
.paid-label {
  font-family: var(--font-sans);
  font-size: 0.8rem;
  color: var(--text-muted);
  font-weight: 500;
}
.price-box-sm {
  width: 115px;
}
.price-box-sm .currency-symbol {
  font-size: 0.82rem;
  padding: 0 0.45rem;
}
.price-box-sm .input-field {
  padding: 0.32rem 0.5rem;
  font-size: 0.85rem;
  height: 32px;
}
.res-card-net {
  margin-top: 0.45rem;
  font-size: 0.78rem;
  font-weight: 600;
  text-align: right;
  min-height: 1.1rem;
}
.net-status.get-back {
  color: #34d399;
}
.net-status.owes {
  color: #f87171;
}
.net-status.settled {
  color: var(--text-dim);
}

/* ── Settlement Section ── */
.settlement-card {
  margin-top: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.15rem 1.25rem;
}
.settlement-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.85rem;
}
.settlement-title {
  font-family: var(--font-sans);
  font-size: 0.95rem;
  font-weight: 600;
  color: #ffffff;
}
.settlement-badge {
  font-size: 0.75rem;
  font-weight: 500;
  padding: 0.2rem 0.55rem;
  border-radius: 9999px;
  background: var(--surface-raised);
  color: var(--text-muted);
  border: 1px solid var(--border);
}
.settlement-badge.paid-full {
  color: #34d399;
  border-color: rgba(52, 211, 153, 0.35);
  background: rgba(52, 211, 153, 0.08);
}
.settlement-badge.paid-partial {
  color: #fbbf24;
  border-color: rgba(251, 191, 36, 0.35);
  background: rgba(251, 191, 36, 0.08);
}
.settlement-meta-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.65rem;
  margin-bottom: 1rem;
}
.settlement-meta-item {
  background: var(--surface-raised);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 0.55rem 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.settlement-meta-item .lbl {
  font-size: 0.72rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.settlement-meta-item .val {
  font-size: 1rem;
  font-weight: 600;
  color: #ffffff;
}
.settlement-meta-item .accent-green {
  color: #34d399;
}
.settlement-meta-item .accent-warn {
  color: #f87171;
}
.settlement-transfers-title {
  font-size: 0.75rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 600;
  margin-bottom: 0.55rem;
}
.settlement-transfers {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.settlement-transfer-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.6rem 0.8rem;
  background: var(--surface-raised);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  font-size: 0.85rem;
}
.transfer-direction {
  color: var(--text-muted);
}
.transfer-direction strong {
  color: #ffffff;
}
.transfer-amount {
  font-weight: 600;
  color: var(--accent2);
}
.settlement-empty-tip {
  font-size: 0.82rem;
  color: var(--text-dim);
  line-height: 1.45;
}

/* ── WhatsApp Copy Button ── */
.btn-whatsapp {
  width: 100%;
  margin-top: 1rem;
  padding: 0.85rem 1.25rem;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #ffffff;
  font-family: var(--font-sans);
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  transition: all 0.2s ease;
}
.btn-whatsapp:hover {
  background: #1a1a1a;
  border-color: var(--border-hover);
  color: #ffffff;
}
.btn-whatsapp:active {
  transform: scale(0.99);
}

/* ── Toast Notification ── */
.copy-toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #18181b;
  color: #ffffff;
  border: 1px solid #27272a;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
  padding: 0.65rem 1.15rem;
  border-radius: 9999px;
  font-size: 0.85rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 9999;
}
.copy-toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* Footer */
.site-footer {
  margin-top: 3.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.82rem;
  color: var(--text-dim);
}

@media (max-width: 600px) {
  body { padding: 1.25rem 0.85rem 4rem; }
  .section { padding: 1.15rem 0.95rem; }
  .totals-bar { grid-template-columns: repeat(2, 1fr); gap: 0.85rem; }
  .taxes-grid { grid-template-columns: 1fr; }
  .cards-grid { grid-template-columns: 1fr; }

  /* Option 1: 2-Row Item Layout on Mobile (Spacious Name on Row 1, Price on Row 2) */
  .item-inputs {
    display: grid;
    grid-template-columns: 1fr 38px;
    grid-template-areas:
      "name del"
      "price price";
    gap: 0.6rem;
    align-items: center;
  }
  .item-name-input {
    grid-area: name;
  }
  .btn-del-item {
    grid-area: del;
    height: 38px;
    width: 38px;
  }
  .item-inputs .price-box {
    grid-area: price;
    width: 100%;
  }

  /* 2-column people grid on mobile */
  .people-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.55rem;
  }
  .person-tag {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.4rem 0.6rem;
    width: 100%;
  }
  .person-name-input {
    width: 100%;
    min-width: 0;
    flex: 1;
    font-size: 16px !important;
  }
  .btn-add-person {
    grid-column: 1 / -1;
    justify-content: center;
    padding: 0.65rem 1rem;
    font-size: 0.9rem;
  }

  /* 16px font prevents iOS Safari from auto-zooming into inputs */
  .input-field {
    font-size: 16px !important;
  }

  /* Thumb-friendly mobile touch targets */
  .btn-pill {
    padding: 0.38rem 0.72rem;
    font-size: 0.85rem;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-del-person {
    padding: 6px;
    min-width: 28px;
    min-height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-del-item {
    height: 42px;
    width: 40px;
  }
  .btn-add-item {
    padding: 0.65rem 1rem;
    font-size: 0.9rem;
  }
}
</style>
</head>
<body>

<div class="container">
  
  <!-- Header -->
  <header class="app-header">
    <h1 class="brand-title" aria-label="SplitBill">Spl<span class="brand-i" aria-hidden="true">ı<span class="brand-dot"></span></span>tBill</h1>
    <button class="btn-reset" id="btn-reset" title="Start a fresh bill">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      New Bill
    </button>
  </header>

  <!-- Section 1: People -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">People</h2>
    </div>

    </div>

  <!-- Section 2: Items -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Items</h2>
    </div>
    
    <div class="items-table" id="items-container">
      <!-- Injected by JS -->
    </div>

    <button class="btn-add-item" id="add-item-btn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>

    </button>

  <!-- Section 3: Taxes -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">VAT &amp; SD</h2>

    <div class="taxes-grid">
      <!-- VAT -->
      <div class="tax-item">
        <div class="tax-item-header">
          <span class="tax-name">VAT</span>
          <div class="btn-toggle-group">
            <button class="btn-toggle active" id="vat-mode-flat" onclick="setTaxMode('vat', 'flat')">Amount</button>
            <button class="btn-toggle" id="vat-mode-pct" onclick="setTaxMode('vat', 'pct')">Rate (%)</button>
          </div>

        <div class="price-box">
          <span class="currency-symbol" id="vat-currency-symbol">৳</span>
          <input type="number" step="any" min="0" inputmode="decimal" class="input-field" id="vat-input" placeholder="0" value="0">
        </div>
        <div class="tax-preview" id="vat-preview" style="display:none;">
          <span>Total VAT:</span>
          <strong id="vat-computed-text">৳ 0.00</strong>

      <!-- Supplementary Duty (SD) -->
      <div class="tax-item">
        <div class="tax-item-header">
          <span class="tax-name">SD</span>
          <div class="btn-toggle-group">
            <button class="btn-toggle active" id="sd-mode-flat" onclick="setTaxMode('sd', 'flat')">Amount</button>
            <button class="btn-toggle" id="sd-mode-pct" onclick="setTaxMode('sd', 'pct')">Rate (%)</button>
          </div>
        </div>
        <div class="price-box">
          <span class="currency-symbol" id="sd-currency-symbol">৳</span>
          <input type="number" step="any" min="0" inputmode="decimal" class="input-field" id="sd-input" placeholder="0" value="0">
        </div>
        <div class="tax-preview" id="sd-preview" style="display:none;">
          <span>Total SD:</span>
          <strong id="sd-computed-text">৳ 0.00</strong>

  <!-- Section 4: Summary — cards only, no view switcher -->
  <section class="summary-section">
    <div class="summary-top">
      <h2 class="summary-title">Summary</h2>

    <!-- Subtle Unassigned Warning in Summary -->
    <div id="summary-warning-container"></div>

    <!-- Totals Bar -->
    <div class="totals-bar">
      <div class="tot-box">
        <span class="tot-label">Subtotal</span>
        <span class="tot-val" id="sum-subtotal">৳ 0.00</span>
      </div>
      <div class="tot-box">
        <span class="tot-label">VAT</span>
        <span class="tot-val" id="sum-vat">৳ 0.00</span>
      </div>
      <div class="tot-box">
        <span class="tot-label">SD</span>

      </div>
      <div class="tot-box">
        <span class="tot-label">Total</span>

    <!-- Output: cards only -->

    <!-- Settlement Card -->
    <div class="settlement-card" id="settlement-card">

    <!-- Copy Summary for WhatsApp -->

</div>

<script>
(function() {
  var STORAGE_KEY = 'splitbill_state_v2';

  function uid() {
    return 'id_' + Math.random().toString(36).substring(2, 9);
  }

  function fmt(num) {
    if (isNaN(num) || num === null || num === undefined) return '0.00';
    return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function getDefaultState() {
    return {
      people: [
        { id: 'p1', name: 'Person 1', paid: 0 },
        { id: 'p2', name: 'Person 2', paid: 0 },
        { id: 'p3', name: 'Person 3', paid: 0 }
      ],
      items: [
        { id: 'it1', name: '', price: 0, splitWith: [] },
        { id: 'it2', name: '', price: 0, splitWith: [] }
      ],
      tax: {
        vat: { mode: 'flat', val: 0 },
        sd:  { mode: 'flat', val: 0 }
      }
    };
  }

  function loadState() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && Array.isArray(parsed.people) && parsed.people.length >= 2 && Array.isArray(parsed.items) && parsed.tax) {
          parsed.people.forEach(function(p) {
            p.paid = parseFloat(p.paid) || 0;
          });
          return parsed;
        }
      }
    } catch (e) {
      console.warn('Could not load saved state:', e);
    }
    return getDefaultState();
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('Could not save state:', e);
    }
  }

  var state = loadState();

  /* ── PEOPLE ── */
  function renderPeople() {
    var container = document.getElementById('people-container');
    container.innerHTML = '';

    state.people.forEach(function(person, idx) {
      var tag = document.createElement('div');
      tag.className = 'person-tag';

      var input = document.createElement('input');
      input.className = 'person-name-input';
      input.type = 'text';
      input.value = person.name;
      input.placeholder = 'Name';
      input.addEventListener('input', function() {
        person.name = this.value || ('Person ' + (idx + 1));
        renderItems();
        recalculate();
        saveState();
      });

      var del = document.createElement('button');
      del.className = 'btn-del-person';
      del.title = 'Remove person';
      del.disabled = state.people.length <= 2;
      del.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg>';
      del.addEventListener('click', function() {
        if (state.people.length <= 2) return;
        removePerson(person.id);
      });

      tag.appendChild(input);
      tag.appendChild(del);
      container.appendChild(tag);
    });

    var addBtn = document.createElement('button');
    addBtn.className = 'btn-add-person';
    addBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg> Add Person';
    addBtn.addEventListener('click', addPerson);
    container.appendChild(addBtn);
  }

  function addPerson() {
    var newId = uid();
    var defaultName = 'Person ' + (state.people.length + 1);
    state.people.push({ id: newId, name: defaultName, paid: 0 });
    renderPeople();
    renderItems();
    recalculate();
    saveState();
  }

  function removePerson(personId) {
    if (state.people.length <= 2) return;
    state.people = state.people.filter(function(p) { return p.id !== personId; });
    state.items.forEach(function(item) {
      item.splitWith = item.splitWith.filter(function(pid) { return pid !== personId; });
    });
    renderPeople();
    renderItems();
    recalculate();
    saveState();
  }

  /* ── ITEMS ── */
  function updateItemWarning(row, item) {
    var isUnassigned = (parseFloat(item.price) || 0) > 0 && item.splitWith.length === 0;
    row.classList.toggle('unassigned', isUnassigned);

    var existingTag = row.querySelector('.unassigned-tag');
    var sharing = row.querySelector('.item-sharing');
    if (isUnassigned && !existingTag && sharing) {
      var tag = document.createElement('span');
      tag.className = 'unassigned-tag';
      tag.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="7"/><line x1="8" y1="4.5" x2="8" y2="8.5"/><circle cx="8" cy="11.5" r="0.6" fill="currentColor"/></svg> Unassigned';
      sharing.appendChild(tag);
    } else if (!isUnassigned && existingTag) {
      existingTag.remove();
    }
  }

  function renderItems() {
    var container = document.getElementById('items-container');
    container.innerHTML = '';

    state.items.forEach(function(item, itemIdx) {
      var isUnassigned = (parseFloat(item.price) || 0) > 0 && item.splitWith.length === 0;
      var row = document.createElement('div');
      row.className = 'item-row' + (isUnassigned ? ' unassigned' : '');

      var inputs = document.createElement('div');
      inputs.className = 'item-inputs';

      var nameInput = document.createElement('input');
      nameInput.className = 'input-field item-name-input';
      nameInput.type = 'text';
      nameInput.placeholder = 'Item name';
      nameInput.value = item.name || '';
      nameInput.addEventListener('input', function() {
        item.name = this.value;
        saveState();
      });

      var priceBox = document.createElement('div');
      priceBox.className = 'price-box';
      var sym = document.createElement('span');
      sym.className = 'currency-symbol';
      sym.textContent = '৳';
      var priceInput = document.createElement('input');
      priceInput.className = 'input-field';
      priceInput.type = 'number';
      priceInput.step = 'any';
      priceInput.min = '0';
      priceInput.placeholder = '0';
      priceInput.setAttribute('inputmode', 'decimal');
      priceInput.value = item.price > 0 ? item.price : '';
      priceInput.addEventListener('input', function() {
        item.price = parseFloat(this.value) || 0;
        updateItemWarning(row, item);
        recalculate();
        saveState();
      });
      priceBox.appendChild(sym);
      priceBox.appendChild(priceInput);

      var delBtn = document.createElement('button');
      delBtn.className = 'btn-del-item';
      delBtn.title = 'Remove item';
      delBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="1.5" y1="1.5" x2="13.5" y2="13.5"/><line x1="13.5" y1="1.5" x2="1.5" y2="13.5"/></svg>';
      delBtn.addEventListener('click', function() {
        state.items.splice(itemIdx, 1);
        renderItems();
        recalculate();
        saveState();
      });

      inputs.appendChild(nameInput);
      inputs.appendChild(delBtn);
      inputs.appendChild(priceBox);

      var sharing = document.createElement('div');
      sharing.className = 'item-sharing';

      var isAllSelected = (item.splitWith.length === state.people.length && state.people.length > 0);
      var allPill = document.createElement('button');
      allPill.className = 'btn-pill pill-all' + (isAllSelected ? ' active' : '');
      allPill.textContent = 'All';
      allPill.addEventListener('click', function() {
        if (item.splitWith.length === state.people.length) {
          item.splitWith = [];
        } else {
          item.splitWith = state.people.map(function(p) { return p.id; });
        }
        renderItems();
        recalculate();
        saveState();
      });
      sharing.appendChild(allPill);

      state.people.forEach(function(person) {
        var isSelected = item.splitWith.indexOf(person.id) !== -1;
        var pBtn = document.createElement('button');
        pBtn.className = 'btn-pill' + (isSelected ? ' active' : '');
        pBtn.textContent = person.name;
        pBtn.addEventListener('click', function() {
          var idx = item.splitWith.indexOf(person.id);
          if (idx === -1) {
            item.splitWith.push(person.id);
          } else {
            item.splitWith.splice(idx, 1);
          }
          renderItems();
          recalculate();
          saveState();
        });
        sharing.appendChild(pBtn);
      });

      if (isUnassigned) {
        var tag = document.createElement('span');
        tag.className = 'unassigned-tag';
        tag.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="7"/><line x1="8" y1="4.5" x2="8" y2="8.5"/><circle cx="8" cy="11.5" r="0.6" fill="currentColor"/></svg> Unassigned';
        sharing.appendChild(tag);
      }

      row.appendChild(inputs);
      row.appendChild(sharing);
      container.appendChild(row);
    });
  }

  function addItem() {
    state.items.push({
      id: uid(),
      name: '',
      price: 0,
      splitWith: []
    });
    renderItems();
    recalculate();
    saveState();
  }

  /* ── TAXES ── */
  window.setTaxMode = function(type, mode) {
    state.tax[type].mode = mode;
    var flatBtn = document.getElementById(type + '-mode-flat');
    var pctBtn  = document.getElementById(type + '-mode-pct');
    var sym     = document.getElementById(type + '-currency-symbol');
    var input   = document.getElementById(type + '-input');
    var preview = document.getElementById(type + '-preview');

    if (mode === 'flat') {
      flatBtn.classList.add('active');
      pctBtn.classList.remove('active');
      sym.textContent     = '৳';
      input.placeholder   = '0';
      preview.style.display = 'none';
    } else {
      pctBtn.classList.add('active');
      flatBtn.classList.remove('active');
      sym.textContent     = '%';
      input.placeholder   = 'e.g. 15';
      preview.style.display = 'flex';
    }
    recalculate();
    saveState();
  };

  document.getElementById('vat-input').addEventListener('input', function() {
    state.tax.vat.val = parseFloat(this.value) || 0;
    recalculate();
    saveState();
  });

  document.getElementById('sd-input').addEventListener('input', function() {
    state.tax.sd.val = parseFloat(this.value) || 0;
    recalculate();
    saveState();
  });

  function syncTaxInputs() {
    var vatIn = document.getElementById('vat-input');
    var sdIn  = document.getElementById('sd-input');
    vatIn.value = state.tax.vat.val > 0 ? state.tax.vat.val : '';
    sdIn.value  = state.tax.sd.val > 0 ? state.tax.sd.val : '';

    var vatFlat = document.getElementById('vat-mode-flat');
    var vatPct  = document.getElementById('vat-mode-pct');
    var vatSym  = document.getElementById('vat-currency-symbol');
    var vatPrev = document.getElementById('vat-preview');
    if (state.tax.vat.mode === 'pct') {
      vatPct.classList.add('active');
      vatFlat.classList.remove('active');
      vatSym.textContent = '%';
      vatIn.placeholder = 'e.g. 15';
      vatPrev.style.display = 'flex';
    } else {
      vatFlat.classList.add('active');
      vatPct.classList.remove('active');
      vatSym.textContent = '৳';
      vatIn.placeholder = '0';
      vatPrev.style.display = 'none';
    }

    var sdFlat = document.getElementById('sd-mode-flat');
    var sdPct  = document.getElementById('sd-mode-pct');
    var sdSym  = document.getElementById('sd-currency-symbol');
    var sdPrev = document.getElementById('sd-preview');
    if (state.tax.sd.mode === 'pct') {
      sdPct.classList.add('active');
      sdFlat.classList.remove('active');
      sdSym.textContent = '%';
      sdIn.placeholder = 'e.g. 15';
      sdPrev.style.display = 'flex';
    } else {
      sdFlat.classList.add('active');
      sdPct.classList.remove('active');
      sdSym.textContent = '৳';
      sdIn.placeholder = '0';
      sdPrev.style.display = 'none';
    }
  }

  /* ── ARITHMETIC ── */
  function recalculate() {
    var foodSubtotal = 0;
    var personBreakdown = {};
    var unassignedCount = 0;

    state.people.forEach(function(p) {
      personBreakdown[p.id] = {
        name: p.name,
        foodShare: 0,
        vatShare: 0,
        sdShare: 0,
        total: 0
      };
    });

    state.items.forEach(function(item) {
      var itemPrice = parseFloat(item.price) || 0;
      foodSubtotal += itemPrice;

      if (itemPrice > 0 && item.splitWith.length === 0) {
        unassignedCount++;
      }

      if (item.splitWith.length > 0 && itemPrice > 0) {
        var perPerson = itemPrice / item.splitWith.length;
        item.splitWith.forEach(function(pid) {
          if (personBreakdown[pid]) {
            personBreakdown[pid].foodShare += perPerson;
          }
        });
      }
    });

    var totalVat = 0;
    if (state.tax.vat.mode === 'flat') {
      totalVat = state.tax.vat.val;
    } else {
      totalVat = (foodSubtotal * state.tax.vat.val) / 100;
    }

    var totalSd = 0;
    if (state.tax.sd.mode === 'flat') {
      totalSd = state.tax.sd.val;
    } else {
      totalSd = (foodSubtotal * state.tax.sd.val) / 100;
    }

    var grandTotal = foodSubtotal + totalVat + totalSd;

    state.people.forEach(function(p) {
      var pb = personBreakdown[p.id];
      var ratio = foodSubtotal > 0 ? (pb.foodShare / foodSubtotal) : (1 / state.people.length);
      pb.vatShare = totalVat * ratio;
      pb.sdShare  = totalSd * ratio;
      pb.total    = pb.foodShare + pb.vatShare + pb.sdShare;
    });

    document.getElementById('sum-subtotal').textContent = '৳ ' + fmt(foodSubtotal);
    document.getElementById('sum-vat').textContent      = '৳ ' + fmt(totalVat);
    document.getElementById('sum-sd').textContent       = '৳ ' + fmt(totalSd);
    document.getElementById('sum-grand').textContent    = '৳ ' + fmt(grandTotal);

    if (state.tax.vat.mode === 'pct') {
      document.getElementById('vat-computed-text').textContent = '৳ ' + fmt(totalVat);
    }
    if (state.tax.sd.mode === 'pct') {
      document.getElementById('sd-computed-text').textContent = '৳ ' + fmt(totalSd);
    }

    // Subtle Warning in Summary
    var warnContainer = document.getElementById('summary-warning-container');
    if (warnContainer) {
      if (unassignedCount > 0) {
        var itemWord = unassignedCount === 1 ? '1 item is' : (unassignedCount + ' items are');
        warnContainer.innerHTML = '<div class="summary-warning-bar">' +
          '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="7"/><line x1="8" y1="4.5" x2="8" y2="8.5"/><circle cx="8" cy="11.5" r="0.6" fill="currentColor"/></svg>' +
          '<span><strong>Notice</strong> &mdash; ' + itemWord + ' unassigned and not included in anyone\'s share.</span>' +
        '</div>';
      } else {
        warnContainer.innerHTML = '';
      }
    }

    renderResults(personBreakdown, grandTotal, foodSubtotal, totalVat, totalSd);
  }

  /* ── RESULTS & SETTLEMENT ── */
  var toastTimeout = null;

  function showToast(msg) {
    var toast = document.getElementById('copy-toast');
    if (!toast) return;
    toast.querySelector('.toast-text').textContent = msg || 'Copied to clipboard';
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function() {
      toast.classList.remove('show');
    }, 2200);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    } else {
      var textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      textArea.style.top = '-999999px';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      return new Promise(function(resolve, reject) {
        document.execCommand('copy') ? resolve() : reject(new Error('copy failed'));
        textArea.remove();
      });
    }
  }

  function computeTransfers(debtors, creditors) {
    var dList = debtors.map(function(d) { return { name: d.name, amount: d.amount }; });
    var cList = creditors.map(function(c) { return { name: c.name, amount: c.amount }; });
    var transfers = [];

    var i = 0;
    var j = 0;
    while (i < dList.length && j < cList.length) {
      var d = dList[i];
      var c = cList[j];
      if (d.amount < 0.01) { i++; continue; }
      if (c.amount < 0.01) { j++; continue; }

      var payment = Math.min(d.amount, c.amount);
      transfers.push({
        from: d.name,
        to: c.name,
        amount: payment
      });

      d.amount -= payment;
      c.amount -= payment;

      if (d.amount < 0.01) i++;
      if (c.amount < 0.01) j++;
    }
    return transfers;
  }

  function generateWhatsAppSummary(breakdown, grandTotal, foodSubtotal, totalVat, totalSd, transfers, restaurantChange, remainingBill) {
    var lines = [];
    lines.push('🧾 SplitBill Summary');
    
    var meta = [];
    if (foodSubtotal > 0 && (totalVat > 0 || totalSd > 0)) {
      meta.push('Subtotal: ৳ ' + fmt(foodSubtotal));
      if (totalVat > 0) meta.push('VAT: ৳ ' + fmt(totalVat));
      if (totalSd > 0) meta.push('SD: ৳ ' + fmt(totalSd));
    }
    if (meta.length > 0) {
      lines.push('Total: ৳ ' + fmt(grandTotal) + ' (' + meta.join(', ') + ')');
    } else {
      lines.push('Total: ৳ ' + fmt(grandTotal));
    }
    lines.push('');

    state.people.forEach(function(p) {
      var pb = breakdown[p.id];
      lines.push('• ' + pb.name + ': ৳ ' + fmt(pb.total));
    });

    if (transfers && transfers.length > 0) {
      lines.push('');
      lines.push('Settlement:');
      transfers.forEach(function(t) {
        lines.push('• ' + t.from + ' pays ৳ ' + fmt(t.amount) + ' to ' + t.to);
      });
      if (restaurantChange > 0.01) {
        lines.push('• Restaurant Change: ৳ ' + fmt(restaurantChange));
      }
    } else if (remainingBill > 0.01) {
      lines.push('');
      lines.push('Remaining to pay restaurant: ৳ ' + fmt(remainingBill));
    }

    lines.push('');
    lines.push('Split via ahnafpatwary.github.io/splitbill');
    return lines.join('\n');
  }

  function renderSettlement(breakdown, grandTotal, foodSubtotal, totalVat, totalSd) {
    var badge = document.getElementById('settlement-status-badge');
    var content = document.getElementById('settlement-content');
    if (!content) return;

    var totalPaid = 0;
    state.people.forEach(function(p) {
      totalPaid += (parseFloat(p.paid) || 0);
    });

    var diff = totalPaid - grandTotal;
    var hasPayments = totalPaid > 0;

    var debtors = [];
    var creditors = [];

    state.people.forEach(function(p) {
      var pb = breakdown[p.id];
      var paid = parseFloat(p.paid) || 0;
      var net = paid - pb.total;
      if (net < -0.01) {
        debtors.push({ id: p.id, name: pb.name, amount: -net });
      } else if (net > 0.01) {
        creditors.push({ id: p.id, name: pb.name, amount: net });
      }
    });

    var transfers = computeTransfers(debtors, creditors);
    var restaurantChange = diff > 0.01 ? diff : 0;
    var remainingBill = diff < -0.01 ? -diff : 0;

    if (badge) {
      if (!hasPayments) {
        badge.className = 'settlement-badge';
        badge.textContent = 'Unpaid';
      } else if (Math.abs(diff) < 0.01) {
        badge.className = 'settlement-badge paid-full';
        badge.textContent = 'Exact Paid';
      } else if (diff > 0.01) {
        badge.className = 'settlement-badge paid-full';
        badge.textContent = 'Overpaid';
      } else {
        badge.className = 'settlement-badge paid-partial';
        badge.textContent = 'Short by ৳ ' + fmt(remainingBill);
      }
    }

    var html = '';
    if (hasPayments) {
      html += '<div class="settlement-meta-grid">';
      html +=   '<div class="settlement-meta-item"><span class="lbl">Total Paid</span><span class="val">৳ ' + fmt(totalPaid) + '</span></div>';
      if (restaurantChange > 0.01) {
        html += '<div class="settlement-meta-item"><span class="lbl">Restaurant Change</span><span class="val accent-green">৳ ' + fmt(restaurantChange) + '</span></div>';
      } else if (remainingBill > 0.01) {
        html += '<div class="settlement-meta-item"><span class="lbl">Remaining Bill</span><span class="val accent-warn">৳ ' + fmt(remainingBill) + '</span></div>';
      }
      html += '</div>';

      if (transfers.length > 0) {
        html += '<div class="settlement-transfers-title">Suggested Transfers</div>';
        html += '<div class="settlement-transfers">';
        transfers.forEach(function(t) {
          html += '<div class="settlement-transfer-item">' +
                    '<span class="transfer-direction"><strong>' + t.from + '</strong> pays <strong>' + t.to + '</strong></span>' +
                    '<span class="transfer-amount">৳ ' + fmt(t.amount) + '</span>' +
                  '</div>';
        });
        html += '</div>';
      } else if (Math.abs(diff) < 0.01 && grandTotal > 0) {
        html += '<div class="settlement-empty-tip">Everyone paid their exact share directly. No transfers needed!</div>';
      }
    } else {
      html += '<div class="settlement-empty-tip">Enter who paid what above to calculate settlement transfers, or tap below to copy the bill breakdown.</div>';
    }

    content.innerHTML = html;

    var copyBtn = document.getElementById('btn-copy-summary');
    if (copyBtn) {
      copyBtn.onclick = function() {
        var summaryText = generateWhatsAppSummary(breakdown, grandTotal, foodSubtotal, totalVat, totalSd, transfers, restaurantChange, remainingBill);
        copyToClipboard(summaryText).then(function() {
          showToast('Summary copied to clipboard!');
        }).catch(function() {
          showToast('Summary copied to clipboard!');
        });
      };
    }
  }

  function renderResults(breakdown, grandTotal, foodSubtotal, totalVat, totalSd) {
    var display = document.getElementById('results-display');
    var grid = display.querySelector('.cards-grid');
    var existingCards = grid ? grid.querySelectorAll('.res-card') : [];
    var needsRebuild = (!grid || existingCards.length !== state.people.length);

    if (!needsRebuild) {
      for (var i = 0; i < state.people.length; i++) {
        if (existingCards[i].getAttribute('data-person-id') !== state.people[i].id) {
          needsRebuild = true;
          break;
        }
      }
    }

    if (needsRebuild) {
      display.innerHTML = '';
      grid = document.createElement('div');
      grid.className = 'cards-grid';

      state.people.forEach(function(p) {
        var pb = breakdown[p.id];
        var card = document.createElement('div');
        card.className = 'res-card';
        card.setAttribute('data-person-id', p.id);

        var top = document.createElement('div');
        top.className = 'res-card-top';
        top.innerHTML = '<span class="res-card-name" title="' + pb.name + '">' + pb.name + '</span><span class="res-card-total">৳ ' + fmt(pb.total) + '</span>';

        var details = document.createElement('div');
        details.className = 'res-card-breakdown';
        details.innerHTML = 
          '<div class="breakdown-row"><span>Food Share:</span><span class="val-food">৳ ' + fmt(pb.foodShare) + '</span></div>' +
          '<div class="breakdown-row"><span>VAT:</span><span class="val-vat">৳ ' + fmt(pb.vatShare) + '</span></div>' +
          '<div class="breakdown-row"><span>SD:</span><span class="val-sd">৳ ' + fmt(pb.sdShare) + '</span></div>';

        var paidRow = document.createElement('div');
        paidRow.className = 'res-card-paid-row';
        paidRow.innerHTML = 
          '<label class="paid-label">Paid:</label>' +
          '<div class="price-box price-box-sm">' +
            '<span class="currency-symbol">৳</span>' +
            '<input type="number" step="any" min="0" inputmode="decimal" class="input-field paid-input" placeholder="0" value="' + (p.paid > 0 ? p.paid : '') + '">' +
          '</div>';

        var netRow = document.createElement('div');
        netRow.className = 'res-card-net';

        var paidInput = paidRow.querySelector('.paid-input');
        paidInput.addEventListener('input', function() {
          p.paid = parseFloat(this.value) || 0;
          recalculate();
          saveState();
        });

        card.appendChild(top);
        card.appendChild(details);
        card.appendChild(paidRow);
        card.appendChild(netRow);
        grid.appendChild(card);
      });

      display.appendChild(grid);
    } else {
      state.people.forEach(function(p, idx) {
        var pb = breakdown[p.id];
        var card = existingCards[idx];

        card.querySelector('.res-card-name').textContent = pb.name;
        card.querySelector('.res-card-name').title = pb.name;
        card.querySelector('.res-card-total').textContent = '৳ ' + fmt(pb.total);
        card.querySelector('.val-food').textContent = '৳ ' + fmt(pb.foodShare);
        card.querySelector('.val-vat').textContent = '৳ ' + fmt(pb.vatShare);
        card.querySelector('.val-sd').textContent = '৳ ' + fmt(pb.sdShare);

        var paidInput = card.querySelector('.paid-input');
        if (document.activeElement !== paidInput) {
          paidInput.value = p.paid > 0 ? p.paid : '';
        }
      });
    }

    state.people.forEach(function(p, idx) {
      var pb = breakdown[p.id];
      var card = grid.children[idx];
      var netEl = card.querySelector('.res-card-net');
      var net = (p.paid || 0) - pb.total;

      if (!p.paid || p.paid === 0) {
        if (pb.total > 0.005) {
          netEl.innerHTML = '<span class="net-status owes">Owes ৳ ' + fmt(pb.total) + '</span>';
        } else {
          netEl.innerHTML = '';
        }
      } else if (Math.abs(net) < 0.01) {
        netEl.innerHTML = '<span class="net-status settled">✓ Settled</span>';
      } else if (net > 0) {
        netEl.innerHTML = '<span class="net-status get-back">+৳ ' + fmt(net) + ' (Gets back)</span>';
      } else {
        netEl.innerHTML = '<span class="net-status owes">-৳ ' + fmt(Math.abs(net)) + ' (Owes)</span>';
      }
    });

    renderSettlement(breakdown, grandTotal, foodSubtotal, totalVat, totalSd);
  }

  // Listeners
  document.getElementById('add-item-btn').addEventListener('click', addItem);

  document.getElementById('btn-reset').addEventListener('click', function() {
    if (confirm('Start a new bill? This will clear all items and reset to 3 people.')) {
      state = getDefaultState();
      saveState();
      syncTaxInputs();
      renderPeople();
      renderItems();
      recalculate();
    }
  });

  // Init
  syncTaxInputs();
  renderPeople();
  renderItems();
  recalculate();

  // Register Service Worker for offline capability
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js').catch(function(err) {
        console.warn('SW registration failed:', err);
      });
    });
  }

})();
</script>

<div id="copy-toast" class="copy-toast">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  <span class="toast-text">Copied to clipboard</span>
</div>
